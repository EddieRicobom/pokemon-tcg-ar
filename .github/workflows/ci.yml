name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Incorporar sprites PokéAPI
        run: npm run sync:sprites
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verificar tipos
        run: npm run typecheck

      - name: Rodar testes
        run: npm test

      - name: Conferir as animações dos treinadores
        run: node scripts/verify-trainer-atlases.ts

      - name: Build de produção
        run: npm run build

      - name: Conferir o build (base path, Service Worker, OCR)
        run: node scripts/verify-dist.mjs
        env:
          REQUIRE_SPRITE_PACK: '1'
